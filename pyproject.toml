[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydisks"
dynamic = ["version"]
description = "Volumes and surface areas of solids of revolution (disc, washer, shell) from formulas or measured data, with plots and animations."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Advay Roongta", email = "roongtaadvay@gmail.com" },
]
keywords = ["calculus", "integration", "solids of revolution", "volume", "sympy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "sympy>=1.8",
    "matplotlib>=3.6",
    "numpy",
]

[project.urls]
Homepage = "https://github.com/AdvayRoongta/pydisks"
Repository = "https://github.com/AdvayRoongta/pydisks"
Issues = "https://github.com/AdvayRoongta/pydisks/issues"

[tool.hatch.version]
path = "src/pydisks/__init__.py"

# Keep the source package small: the README GIFs and demo scripts are
# repository-only (the README links to the GIFs on GitHub).
[tool.hatch.build.targets.sdist]
include = ["src", "test_main.py", "README.md", "LICENSE", "pyproject.toml"]
